# Fork-only workflow (johannesgross1/open-seo).
# Kept in its own file so syncing with every-app/open-seo never conflicts.
#
# - push to main:      build and publish our standalone image
# - daily (03:00 UTC = 04:00 German winter time) or manual run: first sync main with upstream
#   (GitHub "Sync fork"), then build and publish
# - optional: trigger a Coolify redeploy when the secrets COOLIFY_URL,
#   COOLIFY_TOKEN and COOLIFY_SERVICE_UUID are set
#
# If the sync fails (merge conflict, or upstream changed workflow files,
# which GITHUB_TOKEN may not merge), the run fails and GitHub sends an
# email. Then press "Sync fork" on github.com and re-run this workflow.

name: Fork image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'johannesgross1/open-seo' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with every-app/open-seo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main

  image:
    needs: sync
    if: >-
      always() &&
      github.repository == 'johannesgross1/open-seo' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      HAS_COOLIFY: ${{ secrets.COOLIFY_TOKEN != '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/johannesgross1/open-seo-standalone
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push standalone image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/standalone/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        if: env.HAS_COOLIFY == 'true'
        run: |
          curl -fsS -X POST -A "github-actions-fork-image/1.0" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}&force=true"
